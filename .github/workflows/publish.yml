name: Publish to NPM

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish release to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      url: https://www.npmjs.com/package/youbencha

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit belongs to main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Release commit ${GITHUB_SHA} is not reachable from origin/main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify release tag matches package version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [[ "${GITHUB_REF_NAME}" != "${expected_tag}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${package_version}."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Run release gates
        run: npm run verify:release

      - name: Fail if package version already exists
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists on NPM."
            exit 1
          fi

      - name: Select NPM distribution tag
        id: dist_tag
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "${package_version}" == *-* ]]; then
            prerelease="${package_version#*-}"
            prerelease="${prerelease%%.*}"
            case "${prerelease}" in
              alpha|beta|rc|next)
                dist_tag="${prerelease}"
                ;;
              *)
                dist_tag="next"
                ;;
            esac
          else
            dist_tag="latest"
          fi
          echo "tag=${dist_tag}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${package_version} with NPM distribution tag ${dist_tag}."

      - name: Publish to NPM with trusted publishing
        run: npm publish --access public --tag "${{ steps.dist_tag.outputs.tag }}"

      - name: Publish summary
        run: |
          package_version="$(node -p "require('./package.json').version")"
          echo "## Published youbencha@${package_version} (${{ steps.dist_tag.outputs.tag }})" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/youbencha/v/${package_version}" >> "$GITHUB_STEP_SUMMARY"
